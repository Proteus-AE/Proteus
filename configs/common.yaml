# Cross-system workload/hardware interaction constants.
# Short-payload derate: for small hidden dimensions (d_model <= threshold) the
# per-command column payload is too short to amortize command and
# row-activation overheads, reducing sustained efficiency uniformly on every
# evaluated system (Sec. V-A).
short_payload:
  d_model_threshold: 1024
  system_efficiency: 0.65
