# Mixtral-8x7B (MoE, GQA)
name: Mixtral-8x7B
arch: moe
attention: gqa
n_layers: 32
d_model: 4096
n_heads: 32
n_kv_heads: 8            # g = 4
d_head: 128
d_ffn: 14336
weight_bytes: 94.0e+9
active_params: 13.0e+9
# 2 (K,V) x 2 B x 8 x 128 x 32 = 131072 B = 128 KiB (Table I)
kv_bytes_per_token: 131072
moe:
  enabled: true
  n_experts: 8
  top_k: 2
  expert_bytes: 352.0e+6      # per expert per layer (3 * d_model * d_ffn * 2 B)
  dense_bytes: 4.0e+9         # non-expert weights (attention, embeddings, router)
