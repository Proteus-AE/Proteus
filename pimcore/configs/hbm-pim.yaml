# PimCore substrate configuration: HBM2E-class stacked DRAM with per-bank
# PEs behind a fixed one-to-one datapath (NeuPIMs/PAPI-class substrate).
# One simulated channel corresponds to a pseudo-channel slice.
substrate: hbm-pim

geometry:
  channels: 128               # pseudo-channels per 8-stack device
  dies_per_channel: 1
  bankgroups_per_die: 4
  banks_per_bankgroup: 4
  pe_lanes: 16
  pe_freq_ghz: 1.0
  pe_fifo_depth: 1            # no operand FIFO in the fixed datapath
  broadcast_fanout: 1         # one-to-one connectivity only

timing:
  tRCD_ns: 14.0
  tRP_ns: 14.0
  tRAS_ns: 34.0
  tRC_ns: 48.0
  tCCD_L_ns: 2.0
  tCCD_S_ns: 1.0
  tRTP_ns: 5.0
  tWR_ns: 16.0
  tWTR_ns: 8.0
  tRRD_L_ns: 4.0
  tRRD_S_ns: 2.0
  tFAW_ns: 12.0
  tREFI_ns: 3900.0
  tRFCab_ns: 350.0
  burst_ns: 1.0
  ca_cmd_ns: 0.5
  burst_bytes: 32
  row_bytes: 1024

energy:
  act_pre_pj: 800.0
  rd_burst_array_pj: 640.0    # 2.5 pJ/bit internal
  wr_burst_array_pj: 680.0
  rd_burst_io_pj: 360.0       # TSV to the base die
  mac_op_pj: 18.0
  mode_switch_pj: 40.0
  refresh_ab_pj: 24000.0
