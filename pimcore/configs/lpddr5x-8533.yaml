# PimCore substrate configuration: LPDDR5X-8533 near-bank PIM (Proteus).
substrate: lpddr5x-pim

geometry:
  channels: 64                # per device (SPMD symmetric channels)
  dies_per_channel: 4
  bankgroups_per_die: 4
  banks_per_bankgroup: 4
  pe_lanes: 16
  pe_freq_ghz: 1.0
  pe_fifo_depth: 4
  broadcast_fanout: 4

timing:
  tRCD_ns: 18.0
  tRP_ns: 21.0
  tRAS_ns: 42.0
  tRC_ns: 63.0
  tCCD_L_ns: 4.0
  tCCD_S_ns: 2.0
  tRTP_ns: 7.5
  tWR_ns: 34.0
  tWTR_ns: 10.0
  tRRD_L_ns: 7.5
  tRRD_S_ns: 3.75
  tFAW_ns: 20.0
  tREFI_ns: 3906.0
  tRFCab_ns: 280.0
  burst_ns: 2.0               # BG data-bus DDR cadence (tCCD_L / 2)
  ca_cmd_ns: 1.0
  burst_bytes: 32
  row_bytes: 2048

energy:
  act_pre_pj: 900.0
  rd_burst_array_pj: 450.0    # terminated at the bank-local PE
  wr_burst_array_pj: 480.0
  rd_burst_io_pj: 700.0       # added when leaving the die
  mac_op_pj: 18.0
  mode_switch_pj: 40.0
  refresh_ab_pj: 28000.0
