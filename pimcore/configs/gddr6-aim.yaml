# PimCore substrate configuration: GDDR6-class graphics DRAM with per-bank
# processing units behind a fixed one-to-one datapath (CENT-class substrate).
substrate: gddr6-aim

geometry:
  channels: 32                # two x16 channels per package, 16 packages
  dies_per_channel: 1
  bankgroups_per_die: 4
  banks_per_bankgroup: 4
  pe_lanes: 16
  pe_freq_ghz: 1.0
  pe_fifo_depth: 1
  broadcast_fanout: 1

timing:
  tRCD_ns: 14.0
  tRP_ns: 14.0
  tRAS_ns: 28.0
  tRC_ns: 42.0
  tCCD_L_ns: 2.0
  tCCD_S_ns: 1.0
  tRTP_ns: 4.0
  tWR_ns: 16.0
  tWTR_ns: 6.0
  tRRD_L_ns: 6.0
  tRRD_S_ns: 4.0
  tFAW_ns: 24.0
  tREFI_ns: 1900.0
  tRFCab_ns: 120.0
  burst_ns: 1.0
  ca_cmd_ns: 0.5
  burst_bytes: 32
  row_bytes: 2048

energy:
  act_pre_pj: 950.0
  rd_burst_array_pj: 900.0    # 3.5 pJ/bit internal
  wr_burst_array_pj: 940.0
  rd_burst_io_pj: 1200.0      # high-speed signaling
  mac_op_pj: 18.0
  mode_switch_pj: 40.0
  refresh_ab_pj: 15000.0
